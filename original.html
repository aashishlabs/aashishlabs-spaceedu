          <button class="planet planet-r" type="button" data-slot="r"><img data-planet="earth" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202005_3346cc4d-ec3b-44ab-825c-b18e49f5021a.png"><img data-planet="venus" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202012_640b239a-d08a-4200-adb2-741bbe129ac8.png"><img data-planet="mars" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202018_3d559490-f613-4ed7-a3bb-3b7e9fc90fb8.png"></button>

  </main>
  <script>
    (()=>{
      const ORDER=['earth','venus','mars'];
      const DATA={
        earth:{name:'EARTH',still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png',lede:'Learn more about the fascinating details that we call our home, Planet Earth. Course enrollment <br>starts today. Early Bird tickets typically last a week, don\u2019t miss out!'},
        venus:{name:'VENUS',still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_cf55d1d8-7b59-4a64-80da-d72052ae974e.png',lede:'The hottest world in our solar system, wrapped in clouds of sulfuric acid. Course enrollment <br>starts today. Early Bird tickets typically last a week, don\u2019t miss out!'},
        mars:{name:'MARS',still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_0ba6de7c-285d-43dc-b7ab-8c54c73707cb.png',lede:'The rust-red desert world, home to the tallest volcano we know of. Course enrollment <br>starts today. Early Bird tickets typically last a week, don\u2019t miss out!'}
      };
      const sky=document.querySelector('.sky'),clips=[...document.querySelectorAll('.sky video')],title=document.querySelector('.title .ent-line'),lede=document.querySelector('.lede'),buttons=[...document.querySelectorAll('.planet')],labels={l:document.querySelector('.label-l'),r:document.querySelector('.label-r')};
      let featured='';
      function warm(planet){const clip=clips.find(v=>v.dataset.planet===planet);if(clip&&!clip.src&&clip.dataset.src){clip.preload='auto';clip.src=clip.dataset.src;clip.load()}}
      function fill(button,planet){button.dataset.planet=planet;button.setAttribute('aria-label','Show '+DATA[planet].name);button.querySelectorAll('img').forEach(img=>img.classList.toggle('is-shown',img.dataset.planet===planet));labels[button.dataset.slot].textContent=DATA[planet].name}
      function show(next){if(!DATA[next]||next===featured)return;featured=next;clips.forEach(clip=>{const active=clip.dataset.planet===next;if(active){warm(next);clip.classList.add('is-active');const p=clip.play();if(p)p.catch(()=>{})}else{clip.classList.remove('is-active');clip.pause()}});sky.style.backgroundImage=`url('${DATA[next].still}')`;title.textContent=DATA[next].name;lede.innerHTML=DATA[next].lede;const rest=ORDER.filter(x=>x!==next);fill(buttons[0],rest[0]);fill(buttons[1],rest[1])}
      buttons.forEach(button=>{button.addEventListener('click',()=>show(button.dataset.planet));button.addEventListener('pointerenter',()=>warm(button.dataset.planet));button.addEventListener('focus',()=>warm(button.dataset.planet))});show('earth');
      const idle=window.requestIdleCallback||((fn)=>setTimeout(fn,2500));idle(()=>ORDER.forEach(warm),{timeout:4000});
      const row=document.querySelector('.navrow'),burger=document.querySelector('.burger'),nav=document.querySelector('.links');function setMenu(open){row.dataset.open=String(open);burger.setAttribute('aria-expanded',String(open));burger.setAttribute('aria-label',(open?'Close':'Open')+' navigation')}setMenu(false);burger.addEventListener('click',e=>{e.stopPropagation();setMenu(row.dataset.open!=='true')});document.addEventListener('click',e=>{if(!row.contains(e.target))setMenu(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){setMenu(false);burger.focus()}});nav.addEventListener('click',()=>setMenu(false));
      if(document.documentElement.classList.contains('anim')){Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,500))]).then(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{document.documentElement.classList.add('play');setTimeout(()=>document.documentElement.classList.remove('anim','play'),2150)})))}
    })();
  </script>
